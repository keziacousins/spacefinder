name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # macOS only, and not by preference: spacefinder calls getattrlistbulk(2),
    # reads APFS container data through diskutil, and asks TCC what it can see.
    # tests.py refuses to run on any other platform.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor. The code uses `X | None` annotations, which need
        # `from __future__ import annotations` on 3.9, so a break here means
        # someone added a runtime union.
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m compileall -q spacefinder tests.py

      - name: Run tests
        run: python tests.py

  no-dangerous-capability:
    # SAFETY.md promises spacefinder cannot delete a file or run a shell
    # command. tests.py asserts that too, but a test can be deleted alongside
    # the code it guards. This job fails the build on the imports themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The action path must not import subprocess or shutil
        run: |
          if grep -nE '^\s*(import|from)\s+(subprocess|shutil)\b' \
              spacefinder/clean.py; then
            echo "::error file=spacefinder/clean.py::clean.py must not import" \
                 "subprocess or shutil; spacefinder only moves items to the Trash"
            exit 1
          fi

      - name: No shell execution anywhere in the package
        run: |
          if grep -rnE 'shell\s*=\s*True|os\.system|os\.popen' spacefinder/; then
            echo "::error::shell execution reintroduced; see SAFETY.md"
            exit 1
          fi

      - name: The CLI must not accept an arbitrary rules file
        run: |
          if grep -nE '["'\'']--rules|--allow-commands' \
              spacefinder/cli.py; then
            echo "::error file=spacefinder/cli.py::a rules file controls which" \
                 "files get moved; it must not come from the command line"
            exit 1
          fi

  version-matches-tag:
    # A tag that disagrees with __version__ ships a tool that misreports its
    # own version, and the report is what a bug report quotes. Tag pushes only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The tag must equal spacefinder.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Read the literal rather than import: the package is macOS-only.
          code=$(python3 -c "import re, pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('spacefinder/__init__.py').read_text()).group(1))")
          echo "tag=$tag  __version__=$code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $code"
            exit 1
          fi
